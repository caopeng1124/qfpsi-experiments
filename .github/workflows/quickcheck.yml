name: quick-check

# Runs the quick experiment suite on a clean machine and checks the results
# against the numbers quoted in the paper. Reviewers can read the logs of the
# latest run without executing anything locally.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libsodium (for the Ristretto255 prototypes)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsodium23

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the quick suite
        run: ./run_all.sh

      - name: Upload logs, figures and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-run
          path: |
            logs/
            figures/
            experiments/results_quick/
          if-no-files-found: warn
